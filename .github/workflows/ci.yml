name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    name: Reproduce experiment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Download and verify public dataset
        run: python scripts/download_data.py

      - name: Reproduce cross-validation experiment
        run: python -m src.train

      - name: Upload experiment report and metrics
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results-${{ matrix.os }}
          path: |
            reports/RESULTS.md
            reports/generated/experiment_results.json
          if-no-files-found: error
          retention-days: 30